[sdl]
fullscreen=false
output=surface

[dosbox]
machine=svga_s3
memsize=16

[autoexec]
mount c "C:\Users\hages\OneDrive\VS Code\DOS Programs\DOS Utils\DEDIT"
c:
if not exist RUN mkdir RUN
if not exist RUN\GAMES mkdir RUN\GAMES
copy TEST\ALPHA.TXT RUN\ALPHA.TXT > NUL
copy TEST\BETA.COM RUN\BETA.COM > NUL
copy TEST\DESCRIPT.ION RUN\DESCRIPT.ION > NUL
copy TEST\GAMES\README.TXT RUN\GAMES\README.TXT > NUL
attrib +h RUN\ALPHA.TXT
attrib +s RUN\BETA.COM
TEST\INJECT.COM
DEDIT RUN
type RUN\DESCRIPT.ION > TEST\SAVED.TXT
type RUN\DESCRIPT.BAK > TEST\BACKUP.TXT
exit
